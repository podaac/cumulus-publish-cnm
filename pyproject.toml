[tool.poetry]
name = "cumulus-publish-cnm"
version = "0.2.1a7"
description = "Reads in list of CNM's and publishes to SNS topic"
authors = ["Hong-Kit Randy Yeung <hong-kit.r.yeung@jpl.nasa.gov>"]

[tool.poetry.dependencies]
python = "^3.12"
cumulus-process = "^1.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.1"
boto3 = "^1.18.40"
moto = "^3.0.5"
pytest-cov = "^3.0.0"
pylint = "^2.12.2"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
